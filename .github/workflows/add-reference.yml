name: Ajouter une référence

on:
  workflow_dispatch:
    inputs:
      marque:
        description: "Marque (ex. Omega)"
        required: true
      modele:
        description: "Modèle (ex. Speedmaster Professional)"
        required: false
      reference:
        description: "Référence (ex. 310.30.42.50.01.001)"
        required: true
      prix:
        description: "Prix de départ en euros, facultatif (sinon estimé par Claude ou par les premières annonces)"
        required: false
      requete_ebay:
        description: "Requête eBay, facultative (par défaut : marque + référence)"
        required: false
      requete_reddit:
        description: "Requête Reddit, facultative (par défaut : la référence)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Création de la fiche
        env:
          INPUT_BRAND: ${{ inputs.marque }}
          INPUT_MODEL: ${{ inputs.modele }}
          INPUT_REF: ${{ inputs.reference }}
          INPUT_PRIX: ${{ inputs.prix }}
          INPUT_EBAY: ${{ inputs.requete_ebay }}
          INPUT_REDDIT: ${{ inputs.requete_reddit }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/add-reference.mjs
      - name: Première collecte
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
        run: node scripts/update-market.mjs
      - name: Enregistrement
        env:
          REF: ${{ inputs.reference }}
          BRAND: ${{ inputs.marque }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "data: ajout de $BRAND $REF"
            git push
          fi
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: add
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
