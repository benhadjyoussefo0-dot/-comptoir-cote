name: Liste maîtresse des références

on:
  schedule:
    - cron: "41 3 * * 1"   # chaque lundi, 3 h 41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Repérer les références les plus présentes sur eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: node scripts/discover-references.mjs
      - name: Enregistrer la liste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/liste-maitresse.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Liste maîtresse : mise à jour" && git push)
